# .github/workflows/generate-pdf.yml
name: Generate Final Document PDF

on:
  push:
    branches:
      - main
      - develop
      - ci/pdf-automation
  pull_request:
    branches:
      - main
      - develop
      - ci/pdf-automation

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Compile unified Markdown document
        run: bash scripts/merge.sh

      - name: Inject dynamic Table of Contents
        run: node scripts/generate-toc.js

      - name: Clean document text (Regex/Sed)
        run: sed -i 's/\.md://g' full_document.md

      - name: Generate PDF
        run: npx md-to-pdf full_document.md --config-file md-to-pdf.config.json

      - name: Rename PDF to final filename
        run: mv full_document.pdf documentacion-final.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentacion-final
          path: documentacion-final.pdf
          retention-days: 14
